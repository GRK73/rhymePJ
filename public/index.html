<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhyme Finder (한/영 통합 검색)</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>가중치 조절</h3>

                <div class="slider-container global-phoneme-weight" id="consoWeightContainer">
                    <label for="consoWeight">자음 가중치</label>
                    <div class="slider-row">
                        <input type="range" id="consoWeight" min="0" max="10" step="0.5" value="1.0">
                        <span id="consoVal" class="slider-val">1.0</span>
                    </div>
                </div>

                <div class="slider-container global-phoneme-weight" id="vowelWeightContainer">
                    <label for="vowelWeight">모음 가중치</label>
                    <div class="slider-row">
                        <input type="range" id="vowelWeight" min="0" max="10" step="0.5" value="2.5">
                        <span id="vowelVal" class="slider-val">2.5</span>
                    </div>
                </div>

                <div class="slider-container">
                    <label for="freqWeight">빈도수 가중치</label>
                    <div class="slider-row">
                        <input type="range" id="freqWeight" min="0" max="10" step="0.5" value="1.0">
                        <span id="freqVal" class="slider-val">1.0</span>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <h3>언어 필터</h3>
                <div class="filters">
                    <label><input type="radio" name="lang" value="all" checked> 전체</label>
                    <label><input type="radio" name="lang" value="ko"> 한국어</label>
                    <label><input type="radio" name="lang" value="en"> 영어</label>
                </div>
            </div>

            <div class="filter-group">
                <h3>발음 기준</h3>
                <div class="filters">
                    <label><input type="radio" name="pronunciationMode" value="hybrid" checked> 혼합 추천</label>
                    <label><input type="radio" name="pronunciationMode" value="native"> 실제 영어</label>
                    <label><input type="radio" name="pronunciationMode" value="koreanized"> 한국식 영어</label>
                </div>
            </div>

            <div class="filter-group">
                <h3>단어 배제</h3>
                <input type="text" id="excludeInput" placeholder="단어 입력" class="exclude-input">
                <p class="detail-desc" style="margin-top: 0.5rem; margin-bottom: 0;">포함시키지 않을 단어를 쉼표(,)로 구분하여 입력하세요.</p>
            </div>
        </aside>

        <div class="container">
            <header>
                <h1>Rhyme Finder</h1>
                <div class="mode-toggle" role="tablist" aria-label="검색 모드">
                    <button type="button" class="mode-toggle-btn active" data-search-mode="word" aria-selected="true">단어 검색기</button>
                    <button type="button" class="mode-toggle-btn" data-search-mode="linked" aria-selected="false">연결 라임 검색기 (Beta)</button>
                </div>
            </header>

            <main>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="검색할 단어를 입력하세요" autocomplete="off">
                    <input type="text" id="topicInput" placeholder="주제 단어" autocomplete="off">
                    <button id="searchBtn">검색</button>
                </div>

                <div class="topic-box">
                    <label class="linked-surface-option" id="linkedSurfaceOption" hidden>
                        <input type="checkbox" id="useSurfaceKoBigram">
                        한국어 조사 포함
                    </label>
                    <div class="topic-weight">
                        <label for="topicWeight">주제 가중치</label>
                        <input type="range" id="topicWeight" min="0" max="10" step="0.5" value="3.0">
                        <span id="topicVal">3.0</span>
                    </div>
                </div>

                <div id="status" class="status">데이터를 불러오는 중입니다...</div>

                <div class="results-container">
                    <ul id="resultsList" class="results-list"></ul>
                    <button id="loadMoreBtn" class="load-more-btn" style="display: none;">+</button>
                </div>
            </main>
        </div>

        <aside class="sidebar right-sidebar" id="rightSidebar">
            <div class="filter-group detail-group" id="detailGroup">
                <label class="toggle-label">
                    <input type="checkbox" id="useDetailWeights">
                    세부 가중치 적용
                </label>
                <p class="detail-desc">적용 시 기존 자음/모음 가중치는 무시됩니다.</p>
                <div id="detailSlidersContainer">
                    <div class="empty-detail-msg"
                        style="color: #64748b; font-size: 0.9rem; text-align: center; margin-top: 2rem;">검색을 하면 음소
                        단위로<br>가중치를 설정할 수 있습니다.</div>
                </div>
                <button id="reSearchBtn" class="re-search-btn"
                    style="display: none; width: 100%; margin-top: 1rem;">재검색</button>
            </div>
        </aside>
    </div>

    <!-- hangul-js for client-side processing -->
    <script src="https://unpkg.com/hangul-js" type="text/javascript"></script>
    <script src="js/data.js"></script>
    <script src="js/phonetics.js"></script>
    <script src="js/semantic.js"></script>
    <script src="js/linkedRhyme.js"></script>
    <script src="js/render.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
