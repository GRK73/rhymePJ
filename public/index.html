<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhyme Finder (한/영 통합 검색)</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css?v=20260518-lyrics-analysis">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>가중치 조절</h3>

                <div class="slider-container global-phoneme-weight" id="consoWeightContainer">
                    <label for="consoWeight">자음 가중치</label>
                    <div class="slider-row">
                        <input type="range" id="consoWeight" min="0" max="10" step="0.5" value="1.0">
                        <span id="consoVal" class="slider-val">1.0</span>
                    </div>
                </div>

                <div class="slider-container global-phoneme-weight" id="vowelWeightContainer">
                    <label for="vowelWeight">모음 가중치</label>
                    <div class="slider-row">
                        <input type="range" id="vowelWeight" min="0" max="10" step="0.5" value="2.5">
                        <span id="vowelVal" class="slider-val">2.5</span>
                    </div>
                </div>

                <div class="slider-container">
                    <label for="freqWeight">빈도수 가중치</label>
                    <div class="slider-row">
                        <input type="range" id="freqWeight" min="0" max="10" step="0.5" value="1.0">
                        <span id="freqVal" class="slider-val">1.0</span>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <h3>언어 필터</h3>
                <div class="filters">
                    <label><input type="radio" name="lang" value="all" checked> 전체</label>
                    <label><input type="radio" name="lang" value="ko"> 한국어</label>
                    <label><input type="radio" name="lang" value="en"> 영어</label>
                </div>
            </div>

            <div class="filter-group">
                <h3>발음 기준</h3>
                <div class="filters">
                    <label><input type="radio" name="pronunciationMode" value="hybrid" checked> 혼합 추천</label>
                    <label><input type="radio" name="pronunciationMode" value="native"> 실제 영어</label>
                    <label><input type="radio" name="pronunciationMode" value="koreanized"> 한국식 영어</label>
                </div>
            </div>

            <div class="filter-group">
                <h3>단어 배제</h3>
                <input type="text" id="excludeInput" placeholder="단어 입력" class="exclude-input">
                <p class="detail-desc" style="margin-top: 0.5rem; margin-bottom: 0;">포함시키지 않을 단어를 쉼표(,)로 구분하여 입력하세요.</p>
            </div>
        </aside>

        <div class="container">
            <header>
                <h1>Rhyme Finder</h1>
                <div class="mode-toggle" role="tablist" aria-label="검색 모드">
                    <button type="button" class="mode-toggle-btn active" data-search-mode="word" aria-selected="true">단어 검색기</button>
                    <button type="button" class="mode-toggle-btn" data-search-mode="linked" aria-selected="false">연결 라임 검색기 (Beta)</button>
                    <button type="button" class="mode-toggle-btn" data-search-mode="lyrics" aria-selected="false">가사 세부 분석 (Beta)</button>
                </div>
            </header>

            <main>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="검색할 단어를 입력하세요" autocomplete="off">
                    <input type="text" id="topicInput" placeholder="주제 단어" autocomplete="off">
                    <button id="searchBtn">검색</button>
                </div>

                <div class="topic-box">
                    <div class="linked-surface-options" id="linkedSurfaceOptions" hidden>
                        <label class="linked-surface-option">
                            <input type="checkbox" id="useSurfaceKoBigram">
                            한국어 조사 포함
                        </label>
                        <label class="linked-surface-option" id="firstParticleOption" hidden>
                            <input type="checkbox" id="allowFirstParticleKo">
                            첫 단어 조사 허용
                        </label>
                    </div>
                    <div class="topic-weight">
                        <label for="topicWeight">주제 가중치</label>
                        <input type="range" id="topicWeight" min="0" max="10" step="0.5" value="3.0">
                        <span id="topicVal">3.0</span>
                    </div>
                </div>

                <section class="lyrics-analysis-panel" id="lyricsAnalysisPanel" hidden>
                    <div class="lyrics-toolbar">
                        <button type="button" id="lyricsAnalyzeBtn" class="primary-btn">세부 분석</button>
                    </div>

                    <div id="lyricsSections" class="lyrics-sections">
                        <div class="lyrics-section" data-section-id="1">
                            <div class="lyrics-section-header">
                                <select class="lyrics-section-type" aria-label="섹션 종류">
                                    <option value="Intro">Intro</option>
                                    <option value="Verse 1" selected>Verse 1</option>
                                    <option value="Hook">Hook</option>
                                    <option value="Verse 2">Verse 2</option>
                                    <option value="Bridge">Bridge</option>
                                    <option value="Outro">Outro</option>
                                    <option value="Free">Free</option>
                                </select>
                                <button type="button" class="lyrics-section-remove" aria-label="섹션 삭제">×</button>
                            </div>
                            <textarea class="lyrics-section-text" rows="8" placeholder="가사를 입력하세요"></textarea>
                        </div>
                    </div>

                    <div class="lyrics-section-add">
                        <button type="button" id="addLyricsSectionBtn" class="secondary-btn" aria-haspopup="menu" aria-expanded="false">섹션 추가</button>
                        <div id="lyricsSectionTypeMenu" class="lyrics-section-type-menu" role="menu" hidden>
                            <button type="button" data-section-type="Intro" role="menuitem">Intro</button>
                            <button type="button" data-section-type="Verse 1" role="menuitem">Verse 1</button>
                            <button type="button" data-section-type="Hook" role="menuitem">Hook</button>
                            <button type="button" data-section-type="Verse 2" role="menuitem">Verse 2</button>
                            <button type="button" data-section-type="Bridge" role="menuitem">Bridge</button>
                            <button type="button" data-section-type="Outro" role="menuitem">Outro</button>
                            <button type="button" data-section-type="Free" role="menuitem">Free</button>
                        </div>
                    </div>
                </section>

                <div id="status" class="status">데이터를 불러오는 중입니다...</div>

                <div class="results-container">
                    <ul id="resultsList" class="results-list"></ul>
                    <button id="loadMoreBtn" class="load-more-btn" style="display: none;">+</button>
                </div>
            </main>
        </div>

        <aside id="lyricsAnalysisResults" class="lyrics-analysis-results" aria-live="polite"></aside>

        <aside class="sidebar right-sidebar" id="rightSidebar">
            <div class="filter-group detail-group" id="detailGroup">
                <label class="toggle-label">
                    <input type="checkbox" id="useDetailWeights">
                    세부 가중치 적용
                </label>
                <p class="detail-desc">적용 시 기존 자음/모음 가중치는 무시됩니다.</p>
                <div id="detailSlidersContainer">
                    <div class="empty-detail-msg"
                        style="color: #64748b; font-size: 0.9rem; text-align: center; margin-top: 2rem;">검색을 하면 음소
                        단위로<br>가중치를 설정할 수 있습니다.</div>
                </div>
                <button id="reSearchBtn" class="re-search-btn"
                    style="display: none; width: 100%; margin-top: 1rem;">재검색</button>
            </div>
        </aside>
    </div>

    <!-- hangul-js for client-side processing -->
    <script src="https://unpkg.com/hangul-js" type="text/javascript"></script>
    <script src="js/data.js?v=20260518-corpus-boost"></script>
    <script src="js/corpusModels.js?v=20260518-corpus-boost"></script>
    <script src="js/phonetics.js?v=20260516-compound-pronunciation"></script>
    <script src="js/koreanPronunciation.js?v=20260516-compound-pronunciation"></script>
    <script src="js/semantic.js?v=20260516-compound-pronunciation"></script>
    <script src="js/linkedRhyme.js?v=20260516-compound-pronunciation"></script>
    <script src="js/lyricsAnalysis.js?v=20260518-phoneme-rhyme-analysis"></script>
    <script src="js/render.js?v=20260518-corpus-boost"></script>
    <script src="js/tts.js?v=20260516-compound-pronunciation"></script>
    <script src="js/app.js?v=20260518-corpus-boost"></script>
</body>

</html>
